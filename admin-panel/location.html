<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Teliki">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>Teliki — Экраны</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── Auth Overlay ────────────────────────────────────────── -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="auth-logo">Teliki</div>
      <p class="auth-subtitle">Digital Signage</p>
      <form id="authForm" autocomplete="off">
        <input
          type="password"
          class="input"
          id="authPassword"
          placeholder="Введите пароль…"
          autocomplete="off"
        >
        <span class="auth-error" id="authError"></span>
        <button type="submit" class="btn btn-primary auth-btn">Войти</button>
      </form>
    </div>
  </div>

  <!-- ── App Content (hidden until auth) ────────────────────── -->
  <div id="appContent" style="display:none">

  <!-- ── Navbar ──────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="index.html" class="navbar-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Кофейни
    </a>
    <a href="index.html" class="navbar-brand">
      <span class="navbar-logo">Teliki</span>
    </a>
  </nav>

  <!-- ── Page Content ────────────────────────────────────────── -->
  <main class="page-content">
    <header class="page-header">
      <h1 class="page-title" id="locationTitle">
        <span class="skeleton skeleton-text" style="display:inline-block;width:200px;height:28px"></span>
      </h1>
      <p class="page-subtitle">Выберите экран для настройки расписания</p>
      <button class="btn btn-primary" id="btnDeploy" style="margin-top:12px;display:none">
        📡 Выгрузить на телевизоры
      </button>
    </header>

    <!-- Slots Grid -->
    <div class="slots-grid" id="slotsGrid">
      <!-- Generated by JS -->
    </div>

    <!-- Chain Schedule Editor (appears on slot click) -->
    <div id="chainEditorContainer"></div>
  </main>

  </div><!-- /appContent -->

  <!-- ── Toast Container ─────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ── Auth Script ─────────────────────────────────────────── -->
  <script src="js/auth.js"></script>

  <!-- ── Firebase SDK (v10 Compat) ───────────────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/location.js"></script>

  <!-- ── Service Worker Registration ─────────────────────────── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('[Teliki] SW registered:', reg.scope))
          .catch(err => console.warn('[Teliki] SW registration failed:', err));
      });
    }
  </script>

</body>
</html>
